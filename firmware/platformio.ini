; ZoneDash firmware — one PlatformIO project, two builds.
;   env:brain   → ESP32-S3 central unit (engine, HUB75, ESP-NOW, BLE, Ed25519)
;   env:target  → ESP32-C3 target node (ToF/piezo, timestamp, ESP-NOW)
; Shared code lives in lib/protocol/ and is auto-linked into both.
; build_src_filter picks the right src/ subdir per env.

[platformio]
default_envs = brain, target

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200

[env:brain]
; Adafruit MatrixPortal S3. If this board id isn't found, fall back to
; board = esp32-s3-devkitc-1 (same S3 chip).
board = adafruit_matrixportal_esp32s3
build_src_filter = +<brain/>

[env:target]
; ESP32-C3 super-mini. Generic C3 devkit board profile works for it.
board = esp32-c3-devkitm-1
build_src_filter = +<target/>
