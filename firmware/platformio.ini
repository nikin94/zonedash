; ZoneDash firmware — one PlatformIO project, two builds.
;   env:brain   → ESP32-S3 central unit (engine, HUB75, ESP-NOW, BLE, Ed25519)
;   env:target  → ESP32-C3 target node (ToF/piezo, timestamp, ESP-NOW)
; Shared code lives in lib/protocol/ and is auto-linked into both.
; build_src_filter picks the right src/ subdir per env.

[platformio]
default_envs = brain, target

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
; The arduino-esp32 core defaults device builds to gnu++11, but the shared lib/
; code (and the host tests) target C++17 — so a C++14/17 feature that passes the
; -std=c++17 native tests could still break a real flash (as the digit-separator
; literal `20'000'000` did). Pin both device builds to gnu++17 to close that
; host-green / firmware-red gap for good. build_unflags drops the core's own
; -std=gnu++11 first so only one -std reaches the compiler. (env:native sets its
; own -std=c++17, which wins there.)
build_unflags = -std=gnu++11
build_flags = -std=gnu++17

[env:brain]
; Adafruit MatrixPortal S3. If this board id isn't found, fall back to
; board = esp32-s3-devkitc-1 (same S3 chip).
board = adafruit_matrixportal_esp32s3
build_src_filter = +<brain/>

[env:target]
; ESP32-C3 super-mini. Generic C3 devkit board profile works for it.
board = esp32-c3-devkitm-1
build_src_filter = +<target/>
; The super-mini has NATIVE USB (no UART bridge chip). Route Serial to the
; on-chip USB-CDC so `pio device monitor` on /dev/cu.usbmodem* actually sees
; the logs — without this the C3 core prints Serial to UART0 (GPIO20/21), which
; isn't on the USB port, so the monitor stays blank though the board is running.
; ${env.build_flags} keeps the shared -std=gnu++17 from [env].
build_flags =
  ${env.build_flags}
  -DARDUINO_USB_CDC_ON_BOOT=1

[env:native]
; Host build for the hardware-free engine tests: `pio test -e native`.
; Custom framework = the test provides its own main() (see test/test_engine),
; which also compiles/runs directly under clang++/g++.
platform = native
test_framework = custom
build_flags = -std=c++17
build_src_filter = -<*>  ; tests link lib/ only, never the Arduino src
