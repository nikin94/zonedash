name: CI

# Runs the hardware-free (host) firmware test suites on every push to main and
# every pull request — the same `run_native.sh` we run locally. The embedded
# brain/target builds need the Espressif toolchain and real boards, so they are
# not built here; only the pure-logic libs (engine, clocksync, …) are tested.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware-tests:
    name: firmware native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run native test suites
        working-directory: firmware
        run: ./test/run_native.sh

  dk-wire-tests:
    name: DK wire codec tests
    # The Zephyr app itself can't build here (needs the nRF Connect SDK), but its
    # byte-layout functions are pure C — host-compiled and pinned against the same
    # shared fixture the app and brain codecs are, so a fixture byte edit breaks
    # this too. See firmware-dk/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run DK wire codec test
        run: ./firmware-dk/test/run_native.sh

  app-checks:
    name: app typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
